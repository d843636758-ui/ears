<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ears 🎐</title>
<style>
:root {
  --bg: #fff7f5; --card: #ffffff; --ink: #4a3f3c; --sub: #a08c86;
  --main: #e8927c; --main-soft: #fbe4dd; --ring: rgba(232,146,124,.25);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #211b19; --card: #2b2320; --ink: #f0e5e1; --sub: #9c8a84;
          --main: #ef9d86; --main-soft: #3d2e29; --ring: rgba(239,157,134,.2); }
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); min-height: 100vh;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column; align-items: center; padding: 32px 20px 40px; gap: 20px;
}
h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: .12em; }
h1 small { display: block; font-size: .68rem; color: var(--sub); font-weight: 400; letter-spacing: .05em; margin-top: 6px; }
#btn {
  width: 128px; height: 128px; border-radius: 50%; border: none; margin-top: 8px;
  background: var(--main); color: #fff; font-size: 1rem; font-family: inherit;
  box-shadow: 0 6px 24px var(--ring); transition: transform .15s;
  touch-action: none; -webkit-user-select: none; user-select: none;
}
#btn.rec { transform: scale(1.1); box-shadow: 0 0 0 14px var(--ring); animation: breathe 1.4s infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 22px transparent; } }
#tip { font-size: .78rem; color: var(--sub); min-height: 1.2em; }
#baseline { font-size: .72rem; color: var(--sub); }
#out { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
.auth {
  width: 100%; max-width: 440px; display: none; gap: 8px; padding: 12px;
  background: var(--card); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.05);
}
.auth.show { display: flex; }
.auth input {
  min-width: 0; flex: 1; border: 1px solid var(--main-soft); border-radius: 10px;
  padding: 9px 11px; color: var(--ink); background: var(--bg); font: inherit;
}
.auth button { border: 0; border-radius: 10px; padding: 9px 14px; background: var(--main); color: #fff; }
.card {
  background: var(--card); border-radius: 16px; padding: 14px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,.05); animation: pop .25s ease-out;
  position: relative;
}
.card .del {
  position: absolute; top: 10px; right: 12px; color: var(--sub);
  font-size: .8rem; cursor: pointer; padding: 2px 6px; opacity: .6;
}
.card .copy {
  position: absolute; top: 10px; right: 36px; color: var(--sub);
  font-size: .8rem; cursor: pointer; padding: 2px 6px; opacity: .6;
}
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }
.emo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.emo-tag {
  font-size: .8rem; padding: 3px 12px; border-radius: 999px;
  background: var(--main-soft); color: var(--main); font-weight: 600;
}
.hint { font-size: .74rem; color: var(--sub); }
.said { font-size: .95rem; line-height: 1.6; }
.rel { font-size: .7rem; color: var(--sub); margin-top: 8px; }
.meta { font-size: .66rem; color: var(--sub); margin-top: 9px; opacity: .8; }
</style>
</head>
<body>
<h1>ears 🎐<small>让你的AI听懂你的语气</small></h1>
<section id="authPanel" class="auth">
  <input id="accessKey" type="password" autocomplete="current-password" placeholder="输入个人访问钥匙">
  <button id="saveKey" type="button">解锁</button>
</section>
<button id="btn">按住说话</button>
<div id="tip">开口吧，它在认识你</div>
<div id="baseline"></div>
<div id="out"></div>
<script>
const EMOJI = {"开心":"😊","兴奋":"🤩","撒娇":"🥺","平静":"😌","累":"😮‍💨",
               "低落":"🌧️","委屈":"🥹","生气":"😤","嘴硬":"😾","紧张":"😳"};
const btn = document.getElementById("btn"), out = document.getElementById("out"),
      tip = document.getElementById("tip"), bl = document.getElementById("baseline"),
      authPanel = document.getElementById("authPanel"), keyInput = document.getElementById("accessKey"),
      saveKey = document.getElementById("saveKey");
let mr, chunks = [], stream = null, holding = false, authRequired = false;
let accessKey = localStorage.getItem("earsAccessKey") || "";

async function apiFetch(url, options = {}) {
  const headers = new Headers(options.headers || {});
  if (accessKey) headers.set("X-Ears-Key", accessKey);
  const response = await fetch(url, { ...options, headers });
  if (response.status === 401) throw new Error("钥匙不对，再检查一下");
  return response;
}

function textRow(className, value) {
  const node = document.createElement("div");
  node.className = className;
  node.textContent = value;
  return node;
}

function renderCard(d) {
  const card = document.createElement("div");
  card.className = "card";

  const emoRow = document.createElement("div");
  emoRow.className = "emo-row";
  const emo = document.createElement("span");
  emo.className = "emo-tag";
  emo.textContent = `${EMOJI[d.emotion] || "💭"} ${d.emotion || "声音事件"}`;
  const hint = document.createElement("span");
  hint.className = "hint";
  hint.textContent = d.hint || "";
  emoRow.append(emo, hint);
  card.appendChild(emoRow);

  if (d.text) card.appendChild(textRow("said", d.text));
  if (d.relative && Object.keys(d.relative).length) {
    card.appendChild(textRow("rel", "和平时比：" + Object.entries(d.relative).map(([k,v]) => k + " " + v).join("，")));
  }
  if (d.env_sounds && d.env_sounds.length) {
    card.appendChild(textRow("rel", "环境音：" + d.env_sounds.map(x => x.label).join("、")));
  }
  if (d.speaker && !d.text) card.appendChild(textRow("rel", "声纹：" + d.speaker));
  card.appendChild(textRow("meta", `语音编号 ${d.id || "旧记录"} · ${d.ts || ""}`));

  const del = document.createElement("span");
  del.className = "del"; del.textContent = "✕";
  del.addEventListener("click", async () => {
    try {
      const r = await apiFetch("/api/forget", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ts: d.ts }) });
      const result = await r.json();
      if (!r.ok || result.error) throw new Error(result.error || "删除失败");
      card.remove(); tip.textContent = "删掉了，就当没听过";
    } catch (err) { tip.textContent = err.message || "删除失败，再试一次"; }
  });
  card.appendChild(del);

  if (d.text) {
    const cp = document.createElement("span");
    cp.className = "copy"; cp.textContent = "⧉";
    cp.addEventListener("click", async () => {
      const relTxt = d.relative && Object.keys(d.relative).length
        ? "，和平时比" + Object.entries(d.relative).map(([k, v]) => k + v).join("、") : "";
      const line = `[语音 ${d.id || ""}] ${d.text}（语气：${d.emotion}，${d.hint || ""}${relTxt}）`;
      try {
        await navigator.clipboard.writeText(line);
        tip.textContent = "复制好了，也可以直接叫先生用 MCP 来听";
      } catch (_) {
        const ta = document.createElement("textarea");
        ta.value = line; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
        tip.textContent = "复制好了，也可以直接叫先生用 MCP 来听";
      }
    });
    card.appendChild(cp);
  }
  out.prepend(card);
}

async function loadRecent() {
  try {
    const r = await apiFetch("/api/recent?n=8");
    if (!r.ok) throw new Error("读取记录失败");
    const rows = await r.json();
    out.replaceChildren();
    rows.forEach(renderCard);
    tip.textContent = rows.length ? "耳朵接通了，按住说话吧" : "开口吧，它在认识你";
  } catch (err) {
    authPanel.classList.add("show");
    tip.textContent = err.message || "解锁失败";
  }
}

async function init() {
  try {
    const config = await fetch("/api/config").then(r => r.json());
    authRequired = !!config.auth_required;
  } catch (_) {}
  keyInput.value = accessKey;
  authPanel.classList.toggle("show", authRequired && !accessKey);
  if (!authRequired || accessKey) await loadRecent();
}

async function start() {
  if (authRequired && !accessKey) {
    authPanel.classList.add("show"); tip.textContent = "先输入个人访问钥匙"; return;
  }
  holding = true;
  btn.textContent = "准备中…";
  try {
    // 复用麦克风流：首次授权后，之后每次按下都能秒开录
    // 关掉浏览器的噪声抑制/回声消除——它们专杀非人声，环境声（猫叫雨声）会被掐死在麦克风口
    if (!stream || !stream.active) stream = await navigator.mediaDevices.getUserMedia({ audio: { noiseSuppression: false, echoCancellation: false, autoGainControl: true } });
  } catch (_) { tip.textContent = "需要麦克风权限（要在HTTPS或localhost下）"; btn.textContent = "按住说话"; holding = false; return; }
  if (!holding) { btn.textContent = "按住说话"; return; }  // 授权/预热期间手已松开
  chunks = [];
  mr = new MediaRecorder(stream);
  mr.ondataavailable = (e) => chunks.push(e.data);
  mr.onstop = send;
  mr.start();
  btn.classList.add("rec"); btn.textContent = "松开听你说";
}
function stop() {
  holding = false;
  if (mr && mr.state !== "inactive") mr.stop();
  btn.classList.remove("rec"); btn.textContent = "按住说话";
}
async function send() {
  const mime = (mr.mimeType || "audio/webm").split(";")[0];
  const ext = mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : "webm";
  const blob = new Blob(chunks, { type: mime });
  if (blob.size < 1000) { tip.textContent = "太短啦，再说一次"; return; }
  tip.textContent = "在听了…";
  const fd = new FormData();
  fd.append("file", blob, "voice." + ext);
  try {
    const r = await apiFetch("/api/listen", { method: "POST", body: fd });
    const d = await r.json();
    if (d.error) { tip.textContent = d.error; return; }
    renderCard(d);
    tip.textContent = `听到了 ♡ 语音编号 ${d.id || ""}`;
    if (d.baseline_progress) {
      bl.textContent = !d.baseline_progress.startsWith("8/")
        ? `正在认识你的声音 ${d.baseline_progress}` : "已认识你的声音 ♪";
    }
  } catch (err) { tip.textContent = err.message || "网络出错，再试一次"; }
}
saveKey.addEventListener("click", async () => {
  accessKey = keyInput.value.trim();
  if (!accessKey) { tip.textContent = "钥匙还没填呢"; return; }
  localStorage.setItem("earsAccessKey", accessKey);
  await loadRecent();
  if (!tip.textContent.includes("失败") && !tip.textContent.includes("不对")) authPanel.classList.remove("show");
});
keyInput.addEventListener("keydown", e => { if (e.key === "Enter") saveKey.click(); });
btn.addEventListener("pointerdown", (e) => { e.preventDefault(); start(); });
btn.addEventListener("pointerup", stop);
btn.addEventListener("pointercancel", stop);
btn.addEventListener("pointerleave", () => { if (mr && mr.state === "recording") stop(); });
init();
</script>
</body>
</html>
